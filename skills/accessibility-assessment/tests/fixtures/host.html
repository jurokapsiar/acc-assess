<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Host fixture</title></head>
<body>
<main id="host-main">
  <h1>Host page</h1>
  <button id="open-dialog-btn" type="button">Open dialog</button>
  <div id="dlg" role="dialog" aria-modal="true" aria-label="Example dialog" hidden>
    <h2>Example dialog</h2>
    <button id="dlg-close" type="button">Close</button>
  </div>
</main>
<script>
  var openBtn = document.getElementById('open-dialog-btn');
  var dlg = document.getElementById('dlg');
  openBtn.addEventListener('click', function () {
    dlg.hidden = false;
    document.getElementById('dlg-close').focus();
  });
  document.getElementById('dlg-close').addEventListener('click', function () {
    dlg.hidden = true;
    openBtn.focus();
  });
  dlg.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      dlg.hidden = true;
      openBtn.focus();
    }
  });
</script>
</body>
</html>
